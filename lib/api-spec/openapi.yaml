openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /openai/coach:
    post:
      operationId: askCoach
      summary: Ask the AI training coach for advice or a draft workout plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachConversation"
      responses:
        "200":
          description: AI guidance and optional reviewable workout drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachReply"
        "400":
          description: Invalid conversation
        "429":
          description: Please wait before asking again
        "503":
          description: AI coach temporarily unavailable
  /workouts:
    get:
      operationId: listWorkouts
      summary: List the signed-in user's workouts
      responses:
        "200":
          description: Private workouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CloudWorkout"
  /workouts/import:
    post:
      operationId: importWorkouts
      summary: Copy browser routines without overwriting existing cloud routines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutImport"
      responses:
        "200":
          description: Number imported; repeated copies are skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutImportResult"
  /workouts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
    put:
      operationId: saveCloudWorkout
      summary: Create or update a private workout, rejecting stale changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutInput"
      responses:
        "200":
          description: Saved workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudWorkout"
    delete:
      operationId: deleteCloudWorkout
      summary: Delete a private workout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutDeletion"
      responses:
        "204":
          description: Deleted
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CoachMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content: { type: string, minLength: 1, maxLength: 16000 }
    CoachConversation:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/CoachMessage"
    CoachExercise:
      type: object
      additionalProperties: false
      required: [name, sets, reps, notes]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sets: { type: integer, minimum: 1, maximum: 10 }
        reps: { type: string, minLength: 1, maxLength: 100 }
        notes: { type: string, maxLength: 500 }
    CoachRoutine:
      type: object
      additionalProperties: false
      required: [name, notes, exercises]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        notes: { type: string, maxLength: 2000 }
        exercises:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/CoachExercise"
    CoachReply:
      type: object
      additionalProperties: false
      required: [reply, workouts]
      properties:
        reply: { type: string, minLength: 1, maxLength: 8000 }
        workouts:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/CoachRoutine"
    WorkoutDeletion:
      type: object
      required: [updatedAt]
      properties:
        updatedAt: { type: string }
    WorkoutExercise:
      type: object
      required: [id, exerciseSlug, name, sets, reps, notes]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        exerciseSlug: { type: [string, "null"], maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        sets: { type: integer, minimum: 1, maximum: 99 }
        reps: { type: string, minLength: 1, maxLength: 100 }
        notes: { type: string, maxLength: 10000 }
    WorkoutInput:
      type: object
      required: [id, name, notes, exercises, createdAt, updatedAt, isNew]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: string, maxLength: 20000 }
        exercises:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/WorkoutExercise"
        createdAt: { type: string }
        updatedAt: { type: string }
        isNew: { type: boolean }
    CloudWorkout:
      type: object
      required: [id, name, notes, exercises, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        notes: { type: string }
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutExercise"
        createdAt: { type: string }
        updatedAt: { type: string }
    WorkoutImport:
      type: object
      required: [workouts]
      properties:
        workouts:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/WorkoutInput"
    WorkoutImportResult:
      type: object
      required: [imported, skipped]
      properties:
        imported: { type: integer }
        skipped: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

